<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Share browser</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #262626;
        --muted: #737373;
        --border: #d4d4d4;
        --link: #0969da;
        --primary: #171717;
        --primary-text: #fafafa;
        --error: #dc2626;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --text: #e5e5e5;
          --muted: #a3a3a3;
          --border: #404040;
          --link: #4493f8;
          --primary: #fafafa;
          --primary-text: #171717;
          --error: #f87171;
        }
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--text);
        background: var(--bg);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
      }

      a {
        color: var(--link);
      }

      #status {
        color: var(--muted);
        min-height: 1.5em;
      }

      #status.error {
        color: var(--error);
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        cursor: pointer;
      }

      button.primary {
        background: var(--primary);
        color: var(--primary-text);
        border-color: var(--primary);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Share your browser?</h1>
    <p>
      Anyone with the copied id can control all Playwriter tabs and open new ones.
      <a href="https://playwriter.dev/docs/remote-control" target="_blank" rel="noopener noreferrer">Read more</a>
    </p>
    <p id="status"></p>
    <div class="actions">
      <button id="cancel">Cancel</button>
      <button id="share" class="primary">Share</button>
    </div>
    <script src="./share.ts" type="module"></script>
  </body>
</html>
